[project]
name = "fsstratify"
version = "0.0.1"
authors = [
    { name = "Martin Lambertz", email = "martin.lambertz@fkie.fraunhofer.de" },
    { name = "Mariia Rybalka", email = "mariia.rybalka@fkie.fraunhofer.de" },
]
description = "A framework to generate used file systems"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
# Capped at 3.12: the dissect stack officially supports Python 3.9-3.12. On 3.13+,
# dissect.target's pathlib-compat shim breaks (it assumes the private glob._Globber,
# which changed in 3.14).
requires-python = ">=3.12,<3.13"
dependencies = [
    "attrs",
    "click",
    "click_option_group",
    "dissect.ntfs",
    "dissect.extfs",
    "dissect.fat",
    "dissect.target",
    "jinja2",
    "numpy",
    "pandas",
    "portion",
    "pyarrow",
    "pywin32; sys_platform == 'win32'",
    "strictyaml",
    "tqdm",
]


[project.scripts]
fsstratify = "fsstratify.__main__:cli"


[project.urls]
homepage = "https://github.com/fkie-cad/fsstratify"
repository = "https://github.com/fkie-cad/fsstratify"
documentation = "https://github.com/fkie-cad/fsstratify"


[tool.poetry]
include = [
    { path = "fsstratify/prepopulation_datasets/*.parquet", format = ["sdist", "wheel"] },
    { path = "fsstratify/replications/*.j2", format = ["sdist", "wheel"] }
]


[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^8.4.1"
py = "^1.11.0"
pytest-cov = "^6.2.1"
pytest-skip-slow = "^0.0.5"
pyyaml = "^6.0.2"


[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^8.2.3"
sphinx-serve = "^1.0.1"
sphinx-fontawesome = "^0.0.6"
sphinx-rtd-theme = "^3.0.2"


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"


[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests/unit", "tests/system"]


[tool.coverage.run]
source = ["fsstratify"]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
show_missing = true


[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
